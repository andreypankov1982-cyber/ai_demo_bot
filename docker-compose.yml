services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beauty-salon-bot
    restart: unless-stopped
    # FIX: используем стандартный env_file вместо bind-монтирования .env
    env_file:
      - .env
    volumes:
      - ./bot.db:/app/bot.db
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge
